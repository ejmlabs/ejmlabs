version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # The ejmlabs/.github caller pins move only by hand, in one pull request with the release.yml pin and the community files.
      - dependency-name: "ejmlabs/.github"
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
